<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathMate - 10th Maths Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #eef2ff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 700px;
      height: 92vh;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #4f46e5;
      color: #ffffff;
      padding: 16px 20px;
    }
    .chat-header h1 { font-size: 20px; }
    .chat-header p { font-size: 13px; opacity: 0.85; margin-top: 2px; }

    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f8fafc;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: #4f46e5;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .message.bot {
      align-self: flex-start;
      background: #e2e8f0;
      color: #1e293b;
      border-bottom-left-radius: 4px;
    }
    .message.error { background: #fee2e2; color: #991b1b; }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid #e2e8f0;
      background: #ffffff;
    }
    .input-area input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }
    .input-area input:focus { border-color: #4f46e5; }
    .input-area button {
      padding: 0 22px;
      background: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }
    .input-area button:disabled { background: #a5b4fc; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>MathMate</h1>
      <p>Your 10th Maths study assistant</p>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message bot">{{ welcome }}</div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Ask a 10th Maths question..." maxlength="1000" autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    let history = [];

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function setLoading(isLoading) {
      sendBtn.disabled = isLoading;
      userInput.disabled = isLoading;
      if (!isLoading) userInput.focus();
    }

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;

      addMessage(message, "user");
      userInput.value = "";
      setLoading(true);
      const typing = addMessage("Thinking...", "bot");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history })
        });
        const data = await response.json();
        typing.remove();

        if (!response.ok) {
          addMessage(data.error || "Something went wrong.", "bot error");
        } else {
          addMessage(data.reply, "bot");
          history.push({ role: "user", text: message });
          history.push({ role: "model", text: data.reply });
        }
      } catch (error) {
        typing.remove();
        addMessage("Network error. Please try again.", "bot error");
      }

      setLoading(false);
    }

    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
